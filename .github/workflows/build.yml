name: Build

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: "build"
      run: cd ssl && make

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ssl/assets.tar.gz

  windows:
    runs-on: windows-2022

    env:
      VCVARS: "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Auxiliary\\Build\\vcvars64.bat"
      PREFIX: "${{ github.workspace }}\\ssl\\openssl-windows-x64"

    steps:
    - uses: actions/checkout@v3

    - name: "install nasm"
      shell: bash
      run: |
        choco install --no-progress nasm
        echo "C:\\Program Files\\NASM" >> $GITHUB_PATH

    - name: "download openssl"
      shell: bash
      run: |
        version=$(sed -n 's/^OPENSSL_VERSION := "\(.*\)"/\1/p' ssl/Makefile)
        mirror=$(sed -n 's/^OPENSSL_MIRROR := "\(.*\)"/\1/p' ssl/Makefile)
        cd ssl
        curl -fsSL -o openssl.tar.gz "${mirror}/openssl-${version}.tar.gz"
        tar -xzf openssl.tar.gz
        mv "openssl-${version}" openssl

    - name: "build openssl"
      shell: cmd
      working-directory: ssl/openssl
      run: |
        call "%VCVARS%" || exit /b 1
        set CL=/MP
        perl Configure VC-WIN64A no-shared no-deprecated no-tests no-makedepend --prefix="%PREFIX%" --openssldir="%PREFIX%\ssl" || exit /b 1
        nmake /S build_libs || exit /b 1
        nmake /S install_dev || exit /b 1

    - name: "assets"
      shell: bash
      run: cd ssl && 7z a openssl-windows-x64.zip openssl-windows-x64

    - uses: actions/upload-artifact@v7
      with:
        name: openssl-windows-x64
        path: ssl/openssl-windows-x64.zip
        retention-days: 7

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ssl/openssl-windows-x64.zip
